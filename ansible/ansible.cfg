# ansible.cfg — Configuration Ansible pour GreenTech Dynamics
# Ce fichier configure le comportement par défaut d'Ansible

[defaults]
# Inventaire dynamique depuis NetBox
inventory = inventory/netbox_inventory.yml

# Ne pas vérifier les clés SSH (lab uniquement, désactiver en prod)
host_key_checking = False

# Parallélisme : nombre d'équipements configurés simultanément
forks = 20

# Timeout de connexion SSH
timeout = 30

# Répertoire des rôles
roles_path = roles

# Logging de toutes les actions (audit ISO 27001)
log_path = /var/log/ansible/ansible.log

# Affichage plus lisible
stdout_callback = yaml
callbacks_enabled = timer, profile_tasks

# Retry files (utile si un switch est temporairement injoignable)
retry_files_enabled = True
retry_files_save_path = /tmp/ansible-retries

[privilege_escalation]
become = True
become_method = enable

[persistent_connection]
# Timeout pour les connexions réseau (network_cli)
connect_timeout = 60
command_timeout = 30
